<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math for some kids</title>
  <style>
    html {
      font-family: monospace;
      font-size: 26px;;
    }

    table,
    th,
    td {
      border: 1px solid black;
      border-collapse: collapse;
    }
  </style>
</head>

<body>
  <div id="output" style="white-space: pre;">
  </div><br><br><br>
  <button style="font-size: 20px;" onclick="refreshMath()">Refresh</button>
  
  <script>
    function ri()
    {
      var answer = Math.random();
      answer *= 3;
      answer += 0.9;
      answer = Math.pow(answer, 2);
      answer = Math.floor(answer);
      return answer;
    }
      function rp() {
        var f1 = ri();
        var f2 = ri();
        if (Math.random() < 0.2) return `${f1.toString().padStart(2)} / ${f2.toString().padStart(2)} = ${Math.round((f1 / f2) * 100)/100}`;
        if (Math.random() < 0.2) return `${f1.toString().padStart(2)} * ${f2.toString().padStart(2)} = ${f1 * f2}`;
        if (Math.random() < 0.5) return `${f1.toString().padStart(2)} - ${f2.toString().padStart(2)} = ${f1 - f2}`;
        return `${f1.toString().padStart(2) } + ${f2.toString().padStart(2) } = ${f1+f2}`;
      }
    function refreshMath()
    {

      document.getElementById(`output`).innerHTML = `${rp()}<br>${rp()}<br>${rp()}<br>${rp()}<br>${rp()}<br>${rp()}<br>${rp()}<br>${rp()}<br>${rp()}<br>${rp()}<br>${rp()}<br>${rp()}<br>${rp()}`;
    }
    refreshMath();
  </script>
</body>

</html>
